<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Master React - Preview Standalone</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- React 18 & ReactDOM via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.85);
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.4);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-700 dark:text-slate-200 min-h-screen transition-colors font-sans">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, createContext, useContext } = React;

        // --- GRADING SCALE DEFAULT ---
        const DEFAULT_GRADE_MAPPING = [
            { min: 9.0, max: 10.0, char: 'A+', gpa4: 4.0, description: 'Xuất sắc' },
            { min: 8.5, max: 8.99, char: 'A', gpa4: 3.75, description: 'Giỏi' },
            { min: 8.0, max: 8.49, char: 'A-', gpa4: 3.5, description: 'Giỏi' },
            { min: 7.5, max: 7.99, char: 'B+', gpa4: 3.25, description: 'Khá' },
            { min: 7.0, max: 7.49, char: 'B', gpa4: 3.0, description: 'Khá' },
            { min: 6.5, max: 6.99, char: 'B-', gpa4: 2.75, description: 'Khá' },
            { min: 6.0, max: 6.49, char: 'C+', gpa4: 2.5, description: 'Trung bình' },
            { min: 5.5, max: 5.99, char: 'C', gpa4: 2.25, description: 'Trung bình' },
            { min: 5.0, max: 5.49, char: 'C-', gpa4: 2.0, description: 'Trung bình' },
            { min: 4.0, max: 4.99, char: 'D+', gpa4: 1.5, description: 'Yếu' },
            { min: 0.0, max: 3.99, char: 'F', gpa4: 0.0, description: 'Kém' }
        ];

        function convertScore(score10) {
            for (let grade of DEFAULT_GRADE_MAPPING) {
                if (score10 >= grade.min && score10 <= grade.max) return grade;
            }
            return score10 >= 9.0 ? DEFAULT_GRADE_MAPPING[0] : DEFAULT_GRADE_MAPPING[DEFAULT_GRADE_MAPPING.length - 1];
        }

        function calculateSemesterGpa(courses) {
            if (!courses || courses.length === 0) return { gpa: 0, credits: 0, rank: '-' };
            let totalWeightedScore = 0;
            let totalCredits = 0;
            courses.forEach(c => {
                totalWeightedScore += c.gpa4 * c.credits;
                totalCredits += c.credits;
            });
            const gpa = totalCredits > 0 ? Number((totalWeightedScore / totalCredits).toFixed(2)) : 0;
            let rank = 'Kém';
            if (gpa >= 3.6) rank = 'Xuất sắc';
            else if (gpa >= 3.2) rank = 'Giỏi';
            else if (gpa >= 2.5) rank = 'Khá';
            else if (gpa >= 2.0) rank = 'Trung bình';
            else if (gpa >= 1.0) rank = 'Yếu';
            return { gpa, credits: totalCredits, rank };
        }

        function calculateCumulativeGpa(semesters) {
            if (!semesters || semesters.length === 0) return { gpa: 0, credits: 0, rank: '-', totalSemesters: 0 };
            let totalWeightedScore = 0;
            let totalCredits = 0;
            let count = 0;
            semesters.forEach(sem => {
                if (sem.courses.length > 0) count++;
                sem.courses.forEach(c => {
                    totalWeightedScore += c.gpa4 * c.credits;
                    totalCredits += c.credits;
                });
            });
            const gpa = totalCredits > 0 ? Number((totalWeightedScore / totalCredits).toFixed(2)) : 0;
            let rank = 'Kém';
            if (gpa >= 3.6) rank = 'Xuất sắc';
            else if (gpa >= 3.2) rank = 'Giỏi';
            else if (gpa >= 2.5) rank = 'Khá';
            else if (gpa >= 2.0) rank = 'Trung bình';
            else if (gpa >= 1.0) rank = 'Yếu';
            return { gpa, credits: totalCredits, rank, totalSemesters: count };
        }

        // --- APP MAIN COMPONENT ---
        function App() {
            const [theme, setTheme] = useState('dark');
            const [semesters, setSemesters] = useState(() => {
                const saved = localStorage.getItem('gpa_semesters_v3');
                return saved ? JSON.parse(saved) : [{ id: 'sem-1', name: 'Học kỳ 1 (2024-2025)', courses: [] }];
            });
            const [activeSemId, setActiveSemId] = useState(semesters[0]?.id || 'sem-1');
            const [name, setName] = useState('');
            const [credits, setCredits] = useState('');
            const [score10, setScore10] = useState('');
            const [editingId, setEditingId] = useState(null);

            useEffect(() => {
                localStorage.setItem('gpa_semesters_v3', JSON.stringify(semesters));
            }, [semesters]);

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const activeSemester = semesters.find(s => s.id === activeSemId) || semesters[0];
            const currentGpa = useMemo(() => calculateSemesterGpa(activeSemester?.courses || []), [activeSemester]);
            const cumulativeGpa = useMemo(() => calculateCumulativeGpa(semesters), [semesters]);

            const handleAddCourse = (e) => {
                e.preventDefault();
                const scoreNum = parseFloat(score10);
                const credNum = parseInt(credits);
                if (isNaN(scoreNum) || scoreNum < 0 || scoreNum > 10) return alert('Điểm phải từ 0 - 10');
                if (isNaN(credNum) || credNum < 1) return alert('Tín chỉ phải >= 1');

                const converted = convertScore(scoreNum);
                const courseData = {
                    id: editingId || `c-${Date.now()}`,
                    name: name.trim() || 'Môn học mới',
                    credits: credNum,
                    score10: scoreNum,
                    charGrade: converted.char,
                    gpa4: converted.gpa4
                };

                setSemesters(prev => prev.map(sem => {
                    if (sem.id === activeSemester.id) {
                        if (editingId) {
                            return { ...sem, courses: sem.courses.map(c => c.id === editingId ? courseData : c) };
                        } else {
                            return { ...sem, courses: [...sem.courses, courseData] };
                        }
                    }
                    return sem;
                }));

                setName(''); setCredits(''); setScore10(''); setEditingId(null);
            };

            const handleEdit = (c) => {
                setName(c.name); setCredits(c.credits); setScore10(c.score10); setEditingId(c.id);
            };

            const handleDelete = (id) => {
                setSemesters(prev => prev.map(sem => {
                    if (sem.id === activeSemester.id) {
                        return { ...sem, courses: sem.courses.filter(c => c.id !== id) };
                    }
                    return sem;
                }));
            };

            const handleAddSemester = () => {
                const title = prompt('Nhập tên học kỳ mới:');
                if (!title) return;
                const newSem = { id: `sem-${Date.now()}`, name: title, courses: [] };
                setSemesters(prev => [...prev, newSem]);
                setActiveSemId(newSem.id);
            };

            return (
                <div className="min-h-screen p-4 sm:p-6 max-w-5xl mx-auto flex flex-col items-center">
                    {/* Header */}
                    <header className="w-full flex justify-between items-center mb-6">
                        <div className="flex items-center gap-3">
                            <div className="p-3 bg-blue-500/10 text-blue-500 rounded-2xl">
                                <i className="ph-fill ph-calculator text-3xl"></i>
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold text-slate-800 dark:text-white">GPA Master React</h1>
                                <p className="text-xs text-slate-400">Ứng dụng quản lý GPA Đa học kỳ với React</p>
                            </div>
                        </div>
                        <button onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} className="p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                            <i className={`ph-fill ${theme === 'dark' ? 'ph-sun text-yellow-400' : 'ph-moon text-slate-600'} text-xl`}></i>
                        </button>
                    </header>

                    {/* Semester Tabs */}
                    <div className="w-full mb-6 flex gap-2 overflow-x-auto pb-2">
                        {semesters.map(s => (
                            <button key={s.id} onClick={() => setActiveSemId(s.id)} className={`px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap ${s.id === activeSemId ? 'bg-blue-600 text-white' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300'}`}>
                                {s.name} ({s.courses.length})
                            </button>
                        ))}
                        <button onClick={handleAddSemester} className="px-3 py-2 bg-blue-500/10 text-blue-500 rounded-xl text-sm font-bold border border-dashed border-blue-400 whitespace-nowrap">
                            + Kỳ mới
                        </button>
                    </div>

                    {/* Stats Cards */}
                    <div className="w-full grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                        <div className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-5 rounded-2xl">
                            <p className="text-xs uppercase font-semibold opacity-80">GPA Học kỳ ({activeSemester?.name})</p>
                            <h2 className="text-4xl font-black my-1">{currentGpa.gpa.toFixed(2)} <span className="text-sm font-normal">/ 4.0</span></h2>
                            <p className="text-xs opacity-90">Tổng {currentGpa.credits} tín chỉ &bull; Xếp loại: {currentGpa.rank}</p>
                        </div>
                        <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-5 rounded-2xl">
                            <p className="text-xs uppercase font-semibold opacity-80">GPA Tích lũy (Toàn khóa)</p>
                            <h2 className="text-4xl font-black my-1">{cumulativeGpa.gpa.toFixed(2)} <span className="text-sm font-normal">/ 4.0</span></h2>
                            <p className="text-xs opacity-90">Tích lũy {cumulativeGpa.credits} tín chỉ ({cumulativeGpa.totalSemesters} kỳ) &bull; {cumulativeGpa.rank}</p>
                        </div>
                    </div>

                    {/* Form & Table */}
                    <div className="w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700">
                            <h3 className="font-bold mb-4">{editingId ? 'Sửa môn học' : 'Thêm môn học'}</h3>
                            <form onSubmit={handleAddCourse} className="space-y-3">
                                <div>
                                    <label className="text-xs font-semibold">Tên môn học</label>
                                    <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full p-2.5 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl mt-1 text-slate-800 dark:text-white" placeholder="VD: Giải tích 1" required />
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="text-xs font-semibold">Tín chỉ</label>
                                        <input type="number" min="1" value={credits} onChange={e => setCredits(e.target.value)} className="w-full p-2.5 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl mt-1 text-slate-800 dark:text-white" placeholder="3" required />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold">Điểm hệ 10</label>
                                        <input type="number" min="0" max="10" step="0.1" value={score10} onChange={e => setScore10(e.target.value)} className="w-full p-2.5 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl mt-1 text-slate-800 dark:text-white" placeholder="8.5" required />
                                    </div>
                                </div>
                                <button type="submit" className="w-full py-2.5 bg-blue-600 text-white font-bold rounded-xl mt-2">
                                    {editingId ? 'Lưu thay đổi' : 'Thêm môn'}
                                </button>
                            </form>
                        </div>

                        <div className="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
                            <div className="p-4 border-b border-slate-100 dark:border-slate-700 font-bold flex justify-between">
                                <span>Bảng điểm chi tiết</span>
                                <span className="text-xs px-2 py-0.5 bg-slate-200 dark:bg-slate-700 rounded-full">{activeSemester?.courses.length || 0} môn</span>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-left">
                                    <thead className="bg-slate-50 dark:bg-slate-900 text-xs font-semibold">
                                        <tr>
                                            <th className="p-3">Môn học</th>
                                            <th className="p-3 text-center">Tín chỉ</th>
                                            <th className="p-3 text-center">Điểm 10</th>
                                            <th className="p-3 text-center">Điểm chữ</th>
                                            <th className="p-3 text-center">Điểm 4</th>
                                            <th className="p-3 text-right">Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                                        {activeSemester?.courses.length === 0 ? (
                                            <tr><td colSpan="6" className="p-8 text-center text-slate-400">Chưa có môn học nào trong học kỳ này.</td></tr>
                                        ) : (
                                            activeSemester?.courses.map(c => (
                                                <tr key={c.id}>
                                                    <td className="p-3 font-semibold">{c.name}</td>
                                                    <td className="p-3 text-center">{c.credits}</td>
                                                    <td className="p-3 text-center font-bold">{c.score10}</td>
                                                    <td className="p-3 text-center"><span className="px-2 py-0.5 rounded-md font-bold text-xs bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300">{c.charGrade}</span></td>
                                                    <td className="p-3 text-center font-semibold">{c.gpa4}</td>
                                                    <td className="p-3 text-right space-x-1">
                                                        <button onClick={() => handleEdit(c)} className="p-1 text-blue-500"><i className="ph-bold ph-pencil-simple"></i></button>
                                                        <button onClick={() => handleDelete(c.id)} className="p-1 text-red-500"><i className="ph-bold ph-trash"></i></button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
